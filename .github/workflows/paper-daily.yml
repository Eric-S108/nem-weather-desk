# 前推纸面交易的每日任务：在 GitHub 的机器上跑，不依赖你的 Mac 开机。
#
# 2026-10-26 到 11-20 实测：GitHub 的定时触发每天晚 5–9 小时（排在 03:05 UTC，实际 08:00–12:30 才开始），
# 原来"只在 NEM 13:05–13:29 出信号"的规则因此一天都没出成。现在的规则：
#   · NEM 13:05 之后、当天结束之前（= UTC 03:05–14:00）任何一次运行，只要明天的信号还没出，就出；
#     输入按 13:30 之前已公布的版本取（as-of），晚上算出来的和 13:30 当场算出来的是同一份信息；
#   · 13:05 之前触发的运行直接跳过；已经出过信号的也直接跳过（不提交）。
# 所以一天排了四次触发：准时的那几次大多会被跳过，晚到的会落在 UTC 03:05–14:00 里。
# 信号没出全或数据体检失败时任务以失败结束，GitHub 会给你发邮件。
name: paper-daily

on:
  schedule:
    - cron: "5 23 * * *"
    - cron: "5 1 * * *"
    - cron: "5 3 * * *"
    - cron: "5 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Git identity
        run: |
          git config user.name "nem-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Paper trading (signal, settle, fair value, page)
        env:
          WQ_DATA_DIR: ${{ github.workspace }}/data_live
          WQ_CI: "1"
          WQ_HTTP_CACHE: ${{ runner.temp }}/httpcache
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python l1/paper.py --maintenance
          else
            python l1/paper.py --cron
          fi
